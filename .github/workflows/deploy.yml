name: Deploy Galata Rotary Bülten Stüdyosu to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Issue Validation
        run: node scripts/validate-issues.mjs

      - name: Run E2E Test Harness
        run: node tests/e2e-harness.mjs

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r public/* _site/
          mkdir -p _site/output
          cp -r output/* _site/output/ || true
          mkdir -p _site/data
          cp -r data/* _site/data/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
