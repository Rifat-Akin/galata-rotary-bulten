<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="sky-water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" stop-opacity="0" />
      <stop offset="60%" stop-color="#0B2545" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Water reflection base gradient -->
  <rect x="0" y="210" width="1200" height="30" fill="url(#sky-water-grad)" />

  <!-- Layer 1: Distant Peninsula Skyline (Domes & Minarets, Subtle Silhouette) -->
  <g fill="#0B2545" opacity="0.30">
    <!-- Süleymaniye / Historical Peninsula Hills & Domes -->
    <path d="M 0,220 L 0,185 Q 40,180 80,185 L 80,150 L 83,140 L 86,150 L 86,185 Q 120,175 160,170 Q 185,150 210,150 Q 235,150 260,170 Q 285,178 320,180 L 320,145 L 323,135 L 326,145 L 326,180 Q 360,185 400,185 L 400,220 Z" />
    <!-- Distant Bridges / Hills Far Right -->
    <path d="M 820,220 L 820,185 Q 860,180 900,185 L 900,148 L 903,138 L 906,148 L 906,185 Q 940,170 975,160 Q 1005,145 1035,145 Q 1065,145 1095,160 Q 1130,175 1160,185 L 1160,145 L 1163,135 L 1166,145 L 1166,185 L 1200,185 L 1200,220 Z" />
  </g>

  <!-- Layer 2: Midground Galata/Karaköy Shoreline & Heritage Buildings -->
  <g fill="#0B2545" opacity="0.65">
    <!-- Left bank: Han buildings, roofs, cupolas -->
    <path d="M 0,220 L 0,195 L 35,195 L 35,188 L 75,188 L 75,195 L 110,195 L 125,180 L 140,195 L 180,195 L 180,182 L 220,182 L 220,195 L 260,195 L 280,175 L 300,195 L 360,195 L 380,185 L 400,195 L 450,195 L 450,220 Z" />
    
    <!-- Right bank: Tophane, Pera structures, church spires -->
    <path d="M 750,220 L 750,195 L 780,195 L 795,178 L 810,195 L 850,195 L 850,185 L 890,185 L 890,195 L 930,195 L 945,180 L 960,195 L 1020,195 L 1040,182 L 1060,195 L 1120,195 L 1140,186 L 1160,195 L 1200,195 L 1200,220 Z" />
  </g>

  <!-- Layer 3: Foreground Masterpiece — Galata Tower (Galata Kulesi) in Full Glory -->
  <g fill="#0B2545" opacity="1.0">
    <!-- Hill Base Slopes rising to Tower Center (X=590..610) -->
    <path d="M 430,220 L 460,200 L 520,190 L 540,180 L 550,165 L 555,165 L 555,100" />
    
    <!-- GALATA TOWER STRUCTURE -->
    <g id="galata-tower-body">
      <!-- Ground to Lower Drum Base -->
      <path d="M 545,220 L 545,160 L 555,140 L 557,95 L 553,95 L 553,88 L 560,88 L 560,55 L 552,55 L 552,50 L 648,50 L 648,55 L 640,55 L 640,88 L 647,88 L 647,95 L 643,95 L 645,140 L 655,160 L 655,220 Z" />

      <!-- Conical Spire (Külah) -->
      <path d="M 552,50 L 600,6 L 648,50 Z" />
      
      <!-- Spire Finial / Alem (Crescent Tip) -->
      <line x1="600" y1="6" x2="600" y2="0" stroke="#0B2545" stroke-width="2.5" />
      <circle cx="600" cy="0" r="2.5" />

      <!-- Observation Windows & Balcony Corbels (Cutout in Paper Ivory) -->
      <!-- Viewing Gallery Arches -->
      <g fill="#FAF8F3">
        <path d="M 568,62 Q 573,56 578,62 L 578,74 L 568,74 Z" />
        <path d="M 585,62 Q 590,56 595,62 L 595,74 L 585,74 Z" />
        <path d="M 605,62 Q 610,56 615,62 L 615,74 L 605,74 Z" />
        <path d="M 622,62 Q 627,56 632,62 L 632,74 L 622,74 Z" />
        
        <!-- Lower Stone Drum Windows -->
        <path d="M 575,105 Q 580,100 585,105 L 585,120 L 575,120 Z" />
        <path d="M 615,105 Q 620,100 625,105 L 625,120 L 615,120 Z" />

        <path d="M 595,145 Q 600,140 605,145 L 605,162 L 595,162 Z" />
      </g>
    </g>

    <!-- Adjacent Galata Han Roofs & Historic Terraces -->
    <path d="M 645,140 L 665,165 L 685,178 L 710,188 L 755,200 L 770,220 Z" />
  </g>

  <!-- Golden Horn Waterline & Bridge Arches (Haliç & Galata Köprüsü Vurgusu) -->
  <g stroke="#0B2545" stroke-width="1.8" fill="none" opacity="0.85">
    <line x1="0" y1="220" x2="1200" y2="220" stroke-width="2" />
    <!-- Galata Bridge subtle arches below waterline -->
    <path d="M 350,220 Q 375,213 400,220 Q 425,213 450,220 Q 475,213 500,220 Q 525,213 550,220" />
    <path d="M 650,220 Q 675,213 700,220 Q 725,213 750,220 Q 775,213 800,220 Q 825,213 850,220" />
    <line x1="20" y1="226" x2="280" y2="226" opacity="0.4" stroke-dasharray="8,6" />
    <line x1="920" y1="226" x2="1180" y2="226" opacity="0.4" stroke-dasharray="8,6" />
  </g>
</svg>
