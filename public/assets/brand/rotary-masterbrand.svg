<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <!-- Rotary Colors -->
    <style>
      .rotary-blue { fill: #17458F; }
      .rotary-gold { fill: #F7A81B; }
      .rotary-dark { fill: #0B2545; }
      .text-serif { font-family: 'Open Sans', 'Frutiger', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .text-sub { font-family: 'Open Sans', Arial, sans-serif; font-weight: 600; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Rotary Wordmark -->
  <g id="wordmark">
    <text x="165" y="82" class="rotary-blue text-serif" font-size="64" letter-spacing="-1.5">Rotary</text>
    <text x="168" y="118" class="rotary-dark text-sub" font-size="22">GALATA KULÜBÜ</text>
    <text x="168" y="140" class="rotary-blue" font-family="'Open Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">UR 2420. BÖLGE • KULÜP NO: 64336</text>
  </g>

  <!-- Rotary Wheel (Precise Vector Gear) -->
  <g id="rotary-wheel" transform="translate(80, 80)">
    <!-- Outer Gear Rim (Gold) -->
    <circle r="68" class="rotary-gold" />
    
    <!-- 24 Cogs -->
    <g id="cogs" class="rotary-gold">
      <!-- 24 Teeth rotated every 15 degrees -->
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(15)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(30)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(45)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(60)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(75)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(90)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(105)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(120)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(135)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(150)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(165)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(180)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(195)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(210)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(225)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(240)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(255)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(270)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(285)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(300)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(315)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(330)" />
      <path d="M-6,-74 L6,-74 L5,-66 L-5,-66 Z" transform="rotate(345)" />
    </g>

    <!-- Inner Blue Recess Rim -->
    <circle r="52" class="rotary-blue" />
    <circle r="46" class="rotary-gold" />

    <!-- 6 Cutout Spokes -->
    <g id="spoke-cutouts" fill="#FAF8F3">
      <!-- Cutouts between 6 spokes (each spoke 10 deg wide, cutout 50 deg wide) -->
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="scale(0.85)" />
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="rotate(60) scale(0.85)" />
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="rotate(120) scale(0.85)" />
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="rotate(180) scale(0.85)" />
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="rotate(240) scale(0.85)" />
      <path d="M0,0 L27,-38 A46,46 0 0,0 -27,-38 Z" transform="rotate(300) scale(0.85)" />
    </g>

    <!-- Hub Ring -->
    <circle r="20" class="rotary-gold" />
    <circle r="14" class="rotary-blue" />
    <circle r="8" fill="#FAF8F3" />
    
    <!-- Keyway Notch -->
    <rect x="-3" y="-12" width="6" height="6" fill="#FAF8F3" />

    <!-- Lettering ROTARY INTERNATIONAL in rim -->
    <circle r="49" fill="none" stroke="#17458F" stroke-width="1.5" />
    <circle r="22" fill="none" stroke="#17458F" stroke-width="1.5" />
  </g>
</svg>
